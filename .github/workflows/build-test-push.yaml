name: Build, test and push

on:
  workflow_call:
    inputs:
      dockerhub-username:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: true
    secrets:
      dockerhub-token:
        required: true

env:
  IMAGE_NAME: jamjaws/alpine-curl-jq
  TEST_TAG: jamjaws/alpine-curl-jq:test

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read Alpine version
        id: alpine
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ARG ALPINE_TAG=//p' Dockerfile)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Dockerfile must define one stable Alpine version.' >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the Alpine version: v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            jamjaws/alpine-curl-jq
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{major}},value=${{ steps.alpine.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.alpine.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.alpine.outputs.version }}
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
  build-test:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
          - platform: linux/arm/v6
            arch: armv6
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: ${{ inputs.push }}
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: ${{ !inputs.push }}
          tags: ${{ !inputs.push && env.TEST_TAG || '' }}
          # Publishing builds stage an untagged digest; public tags move only after all tests pass.
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || '' }}
      - name: Test
        env:
          PLATFORM: ${{ matrix.platform }}
          TEST_IMAGE: ${{ inputs.push && format('{0}@{1}', env.IMAGE_NAME, steps.build.outputs.digest) || env.TEST_TAG }}
        run: |
          docker run --rm --platform "$PLATFORM" --entrypoint sh \
            -v "$PWD/test.sh:/opt/test.sh:ro" \
            "$TEST_IMAGE" /opt/test.sh
      - name: Export tested digest
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload tested digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  publish:
    needs: [metadata, build-test]
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - name: Download tested digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}
      - name: Publish multi-platform image
        env:
          IMAGE_TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          images=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            images+=("$IMAGE_NAME@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
