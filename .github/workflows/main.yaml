name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          ignore: DL3018
  build-test-push:
    needs: lint
    uses: ./.github/workflows/build-test-push.yaml
    with:
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
  # Keep scheduled workflows active when there are no source changes for 60 days.
  last-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}
      - name: Set last run date
        run: date --utc --iso-8601=seconds > last_run.txt
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: schedule
          commit_message: 'chore: record scheduled workflow activity'
          file_pattern: last_run.txt
          create_branch: true
          push_options: '--force'
