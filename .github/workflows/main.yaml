name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          ignore: DL3018
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: '1.7.12'
          pyflakes: false
      - name: Lint shell scripts
        run: shellcheck test.sh tests/*.sh
  build-test-push:
    needs: lint
    uses: ./.github/workflows/build-test-push.yaml
    with:
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    secrets:
      dockerhub-token: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN || '' }}
  # Keep scheduled workflows active when there are no source changes for 60 days.
  last-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set last run date
        run: date --utc --iso-8601=seconds > last_run.txt
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          branch: schedule
          commit_message: 'chore: record scheduled workflow activity'
          file_pattern: last_run.txt
          create_branch: true
          push_options: '--force'
